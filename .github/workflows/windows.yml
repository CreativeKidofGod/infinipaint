name: Windows portable build

# Builds a portable Windows x86_64 zip of this fork.
# The first run compiles Skia and the other Conan dependencies from source
# (1-2+ hours). They are cached afterwards, so later runs only rebuild InfiniPaint.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      # Short paths: Skia's build tree overflows Windows' 260-char path limit otherwise.
      CONAN_HOME: C:\c2
      BUILD_DIR: C:\b
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.10,<3"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Detect MSVC version for Conan
        id: msvc
        shell: pwsh
        run: |
          conan profile detect --force
          $ver = (Select-String -Path "$env:CONAN_HOME\profiles\default" -Pattern '^compiler.version=(\d+)').Matches[0].Groups[1].Value
          Write-Host "Detected compiler.version=$ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\c2\p
          key: conan-win-x86_64-msvc${{ steps.msvc.outputs.version }}-${{ hashFiles('conanfile.py', 'conan/**', 'conan/profiles/win-x86_64') }}
          restore-keys: |
            conan-win-x86_64-msvc${{ steps.msvc.outputs.version }}-

      - name: Export custom Conan recipes
        shell: cmd
        run: call conan\export_libs.bat

      - name: Conan install (builds Skia on first run)
        shell: cmd
        run: >
          conan install . -of=%BUILD_DIR% --build=missing
          -pr=conan/profiles/win-x86_64
          -s compiler.version=${{ steps.msvc.outputs.version }}
          -s build_type=Release
          --deployer=runtime_deploy --deployer-folder=%BUILD_DIR%\runtime

      # Save the cache even if a later step fails, so a failed compile of
      # InfiniPaint itself never throws away hours of dependency builds.
      - name: Save Conan cache
        if: always() && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\c2\p
          key: conan-win-x86_64-msvc${{ steps.msvc.outputs.version }}-${{ hashFiles('conanfile.py', 'conan/**', 'conan/profiles/win-x86_64') }}

      - name: Build InfiniPaint (portable)
        shell: cmd
        run: |
          cd /d %BUILD_DIR%\build
          call generators\conanbuild.bat
          cmake %GITHUB_WORKSPACE% -DCMAKE_TOOLCHAIN_FILE="generators\conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DCONFIG_NEXT_TO_EXECUTABLE=ON || exit /b 1
          cmake --build . --config Release --parallel || exit /b 1
          call generators\deactivate_conanbuild.bat

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $pkg = "$env:GITHUB_WORKSPACE\package\InfiniPaint-Custom"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          $exe = Get-ChildItem "$env:BUILD_DIR\build" -Recurse -Filter infinipaint.exe | Select-Object -First 1
          if (-not $exe) { throw "infinipaint.exe was not produced" }
          Copy-Item $exe.FullName $pkg
          # Shared libraries from Conan dependencies (hwloc, tbb, ...)
          if (Test-Path "$env:BUILD_DIR\runtime") {
            Get-ChildItem "$env:BUILD_DIR\runtime" -Recurse -Filter *.dll | Copy-Item -Destination $pkg
          }
          # MSVC runtime, so it runs on PCs without the Visual C++ Redistributable
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Get-ChildItem $crt.FullName -Filter *.dll | Copy-Item -Destination $pkg
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE\assets\data" "$pkg\data"
          Copy-Item "$env:GITHUB_WORKSPACE\NOTICE" "$pkg\NOTICE.txt"
          Copy-Item "$env:GITHUB_WORKSPACE\COPYING" "$pkg\COPYING.txt"
          Get-ChildItem $pkg

      - name: Check for missing DLLs
        shell: pwsh
        run: |
          $pkg = "$env:GITHUB_WORKSPACE\package\InfiniPaint-Custom"
          $deps = (dumpbin /dependents "$pkg\infinipaint.exe") | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
          $missing = @()
          foreach ($d in $deps) {
            $inPkg = Test-Path (Join-Path $pkg $d)
            $inSys = Test-Path (Join-Path "$env:WINDIR\System32" $d)
            $apiSet = $d -match '^(api|ext)-ms-'
            Write-Host ("{0,-40} pkg={1} system={2}" -f $d, $inPkg, $inSys)
            if (-not ($inPkg -or $inSys -or $apiSet)) { $missing += $d }
          }
          if ($missing.Count -gt 0) { throw "Missing DLLs: $($missing -join ', ')" }

      - name: Zip
        shell: pwsh
        run: |
          $name = "infinipaint-custom-win-x86_64-portable-${{ github.run_number }}"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\package\InfiniPaint-Custom" -DestinationPath "$env:GITHUB_WORKSPACE\$name.zip"
          "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 30
