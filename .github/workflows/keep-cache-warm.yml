name: Keep build cache warm

# GitHub deletes saved caches that aren't used for 7 days. Restoring the Skia
# cache once a week keeps it alive, so the first build after a break doesn't
# spend ~25 minutes rebuilding Skia. Takes a few minutes, free on public repos.
# Note: GitHub pauses scheduled workflows after 60 days with no pushes to the repo.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  touch-cache:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Restore newest Conan cache (counts as a use)
        uses: actions/cache/restore@v6
        with:
          path: C:\c2\p
          key: keep-warm-never-matches
          restore-keys: |
            conan-win-x86_64-
